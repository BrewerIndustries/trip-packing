# Server blocks for /etc/nginx/sites-available/dabrewer.dev.
# Tailnet-only: DNS points at the Tailscale address, AND nginx refuses anything
# that doesn't come from a tailnet (100.64.0.0/10) or the box itself.

server {
    listen 443 ssl;
    server_name packing.dev.dabrewer.dev;
    ssl_certificate     /etc/letsencrypt/live/dev.dabrewer.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.dabrewer.dev/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    location / {
        proxy_pass http://localhost:4850;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name packing.dabrewer.dev;
